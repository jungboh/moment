<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMENT - Party Recipe</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #fffaf8; }
  body { font-family: Arial, "Noto Sans KR", sans-serif; color: #2c1f1f; overflow-x: auto; }
  a { color: inherit; text-decoration: none; }
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    height: 82px;
    padding: 0 3.1%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, .96);
    border-bottom: 1px solid rgba(44, 31, 31, .08);
    box-shadow: 0 10px 28px rgba(44, 31, 31, .04);
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
  .brand-main {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, 2.5vw, 40px);
    font-weight: 600;
    letter-spacing: .08em;
  }
  .brand-sub {
    margin-top: 8px;
    padding-left: .45em;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12px;
    letter-spacing: .36em;
    text-transform: uppercase;
  }
  .nav { display: flex; align-items: center; gap: clamp(26px, 3vw, 52px); font-size: 16px; }
  .nav a { white-space: nowrap; transition: color .2s ease; }
  .nav a:hover { color: #b5545a; }
  .nav .contact {
    padding: 13px 28px;
    color: #fff;
    background: #bf4f5e;
    border-radius: 999px;
    box-shadow: 0 8px 18px rgba(181, 84, 90, .18);
  }
  .nav .contact:hover { color: #fff; background: #9f3f4d; }
  .menu-toggle { display: none; width: 42px; height: 42px; border: 0; background: transparent; }
  .menu-toggle span { display: block; width: 24px; height: 2px; margin: 6px auto; background: #2c1f1f; }
  .mobile-nav {
    display: none;
    position: fixed;
    top: 82px;
    left: 0;
    right: 0;
    z-index: 19;
    padding: 20px 6% 26px;
    background: rgba(255, 255, 255, .98);
    border-bottom: 1px solid rgba(181, 84, 90, .14);
  }
  .mobile-nav.open { display: grid; gap: 16px; }
  .page {
    position: relative;
    width: 100%;
    max-width: 1536px;
    min-width: 980px;
    margin: 0 auto;
    aspect-ratio: 3 / 2;
    background: #fffaf8;
  }
  .concept {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .hotspot {
    position: absolute;
    display: block;
    border-radius: 999px;
    color: transparent;
    text-indent: -9999px;
    overflow: hidden;
  }
  .hotspot:focus-visible {
    outline: 3px solid rgba(181, 84, 90, .6);
    outline-offset: 2px;
  }
  .visual-button {
    position: absolute;
    z-index: 2;
    left: 35.3%;
    top: 45.2%;
    width: 13.8%;
    height: 5.9%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #bf4f5e;
    border-radius: 999px;
    background: rgba(255, 250, 248, .94);
    color: #bf4f5e;
    font-size: clamp(13px, 1.05vw, 17px);
    font-weight: 600;
    letter-spacing: -.01em;
    box-shadow: 0 5px 18px rgba(255, 250, 248, .84);
    overflow: visible;
  }
  .visual-button::before {
    content: "";
    position: absolute;
    inset: -6px -8px;
    z-index: -1;
    border-radius: 999px;
    background: #fffaf8;
  }
  .btn-events { left: 35.3%; top: 45.2%; width: 13.8%; height: 5.9%; }
  .btn-booking { left: 50.0%; top: 45.2%; width: 13.7%; height: 5.9%; }
  .cat-bridal { left: 14.0%; top: 56.0%; width: 11.1%; height: 12.6%; }
  .cat-propose { left: 26.0%; top: 56.0%; width: 11.1%; height: 12.6%; }
  .cat-gender { left: 38.3%; top: 56.0%; width: 11.1%; height: 12.6%; }
  .cat-photo { left: 50.4%; top: 56.0%; width: 11.1%; height: 12.6%; }
  .cat-100days { left: 62.5%; top: 56.0%; width: 11.1%; height: 12.6%; }
  .cat-dol { left: 74.4%; top: 56.0%; width: 11.1%; height: 12.6%; }
  .cat-entrance { left: 19.0%; top: 70.0%; width: 11.6%; height: 13.1%; }
  .cat-graduation { left: 31.4%; top: 70.0%; width: 11.6%; height: 13.1%; }
  .cat-birthday { left: 43.8%; top: 70.0%; width: 11.6%; height: 13.1%; }
  .cat-christmas { left: 56.2%; top: 70.0%; width: 11.6%; height: 13.1%; }
  .cat-gift { left: 68.6%; top: 70.0%; width: 11.6%; height: 13.1%; }
  .dol-label-fix,
  .memory-copy-fix {
    position: absolute;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fffdfb;
    color: #ad7457;
    pointer-events: none;
  }
  .dol-label-fix {
    left: 75.05%;
    top: 65.05%;
    width: 9.8%;
    height: 2.35%;
    font-size: clamp(10px, .82vw, 13px);
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .memory-copy-fix {
    left: 75.25%;
    top: 91.78%;
    width: 17.7%;
    height: 2.1%;
    justify-content: flex-start;
    padding-left: .2%;
    color: #2c1f1f;
    font-size: clamp(11px, .9vw, 14px);
    font-weight: 400;
    letter-spacing: 0;
  }
  @media (max-width: 980px) {
    body { background: #fff; }
    .page { margin: 0; }
    .nav { display: none; }
    .menu-toggle { display: block; }
  }
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="MOMENT Party Recipe">
      <span class="brand-main">MOMENT</span>
      <span class="brand-sub">Party Recipe</span>
    </a>
    <nav class="nav" aria-label="주 메뉴">
      <a href="events.html">Moment 이야기</a>
      <a href="packages.html">서비스</a>
      <a href="portfolio.html">포트폴리오</a>
      <a href="booking.html">예약</a>
      <a class="contact" href="booking.html">문의하기</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
  </header>
  <div class="mobile-nav" id="mobileNav">
    <a href="events.html">Moment 이야기</a>
    <a href="packages.html">서비스</a>
    <a href="portfolio.html">포트폴리오</a>
    <a href="booking.html">예약</a>
    <a href="booking.html">문의하기</a>
  </div>

  <main class="page" aria-label="MOMENT Party Recipe 홈페이지 첫 화면">
    <img class="concept" src="concept.png" alt="MOMENT Party Recipe 첫 화면">
    <a class="visual-button" href="events.html">Moment 이야기</a>
    <a class="hotspot btn-events" href="events.html">Moment 이야기</a>
    <a class="hotspot btn-booking" href="booking.html">지금 예약하기</a>
    <a class="hotspot cat-bridal" href="packages.html?cat=wedding">브라이덜샤워</a>
    <a class="hotspot cat-propose" href="packages.html?cat=wedding">프로포즈</a>
    <a class="hotspot cat-gender" href="packages.html?cat=baby">젠더리빌</a>
    <a class="hotspot cat-photo" href="packages.html?cat=wedding">웨딩촬영 소품</a>
    <a class="hotspot cat-100days" href="packages.html?cat=baby">백일상</a>
    <a class="hotspot cat-dol" href="packages.html?cat=baby">돌상</a>
    <a class="hotspot cat-entrance" href="packages.html?cat=graduation">입학식</a>
    <a class="hotspot cat-graduation" href="packages.html?cat=graduation">졸업식</a>
    <a class="hotspot cat-birthday" href="packages.html?cat=birthday">생일파티</a>
    <a class="hotspot cat-christmas" href="packages.html?cat=senior">크리스마스</a>
    <a class="hotspot cat-gift" href="packages.html?cat=gift">답례품</a>
    <span class="dol-label-fix" aria-hidden="true">1ST BIRTHDAY</span>
    <span class="memory-copy-fix" aria-hidden="true">소중한 순간을 아름답게 담아</span>
  </main>
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const mobileNav = document.getElementById('mobileNav');
    menuToggle?.addEventListener('click', () => mobileNav.classList.toggle('open'));
  </script>
</body>
</html>
