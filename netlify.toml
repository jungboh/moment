<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영수증 분개 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF9EF;
    --dot: #FCE9D2;
    --ink: #3A2E22;
    --ink-soft: #93816C;
    --coral: #FF7A59;
    --coral-2: #FF9C7F;
    --coral-light: #FFE4D6;
    --mint: #35B58C;
    --mint-light: #DDF4EA;
    --sun: #FFC94A;
    --sun-light: #FFF2D2;
    --blue: #5C8DFF;
    --blue-light: #E6EDFF;
    --sad: #FF6B6B;
    --sad-light: #FFE7E7;
    --card: #FFFFFF;
    --line: #F3E4D2;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(var(--dot) 1.6px, transparent 1.6px);
    background-size: 22px 22px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .display { font-family: 'Jua', -apple-system, sans-serif; }

  header {
    background: linear-gradient(160deg, var(--coral) 0%, var(--coral-2) 100%);
    color: #fff; padding: 26px 20px 40px; position: relative; overflow: hidden;
    border-radius: 0 0 28px 28px;
  }
  header .blob {
    position: absolute; right: -30px; top: -30px; width: 150px; height: 150px; border-radius: 50%;
    background: rgba(255,255,255,0.14);
  }
  header .blob2 {
    position: absolute; left: -20px; bottom: -50px; width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,0.10);
  }
  .header-row { display: flex; align-items: center; gap: 14px; position: relative; }
  .header-text { flex: 1; min-width: 0; }
  header .eyebrow { font-size: 11.5px; letter-spacing: 0.14em; color: #FFE9DE; margin-bottom: 4px; font-weight: 700; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 7px 0 0; font-size: 12.5px; color: #FFEFE7; line-height: 1.55; }
  header .mascot { width: 74px; height: 74px; flex-shrink: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12)); }

  main { max-width: 620px; margin: -18px auto 0; padding: 0 15px 70px; position: relative; }

  .card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 20px;
    padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 14px rgba(160,110,60,0.07);
  }
  .card h2 {
    font-family: 'Jua', sans-serif; font-size: 15.5px; margin: 0 0 13px; color: var(--coral); font-weight: 400;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .num {
    display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;
    background: var(--coral-light); color: var(--coral); font-size: 12px; font-family: 'Jua', sans-serif;
  }
  .card.locked { opacity: 0.4; pointer-events: none; }

  .field-row { display: flex; gap: 9px; margin-bottom: 10px; }
  .field { flex: 1; min-width: 0; }
  .field label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 700; }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px;
    font-size: 13.5px; font-family: inherit; color: var(--ink); background: #FFFCF7;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--coral-2); box-shadow: 0 0 0 3px var(--coral-light); }
  .hint { font-size: 11px; color: var(--ink-soft); margin: -3px 0 10px; line-height: 1.5; }

  button.primary {
    width: 100%; margin-top: 6px; background: var(--coral); color: #fff; border: none; padding: 13px;
    border-radius: 14px; font-size: 14.5px; font-weight: 700; cursor: pointer; transition: transform .1s, background .15s, opacity .15s;
    box-shadow: 0 3px 0 #E05F3F;
  }
  button.primary:hover:not(:disabled) { background: #FF6842; }
  button.primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #E05F3F; }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .drop { border: 2px dashed #F5C9AE; border-radius: 16px; padding: 22px 14px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover { border-color: var(--coral); background: var(--coral-light); }
  .drop svg { width: 46px; height: 46px; margin-bottom: 6px; }
  .drop .main-txt { font-size: 13.5px; font-weight: 700; }
  .drop .sub-txt { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  input[type=file] { display: none; }

  .receipt-preview { text-align: center; }
  .receipt-preview img { max-width: 100%; max-height: 320px; border-radius: 14px; border: 1.5px solid var(--line); }
  .change-btn { margin-top: 9px; font-size: 12px; color: var(--coral); background: none; border: none; text-decoration: underline; cursor: pointer; font-weight: 700; }

  .lines-wrap { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .line-row { display: flex; gap: 7px; align-items: center; }
  .line-row .side-badge {
    flex-shrink: 0; width: 40px; text-align: center; font-size: 11px; font-weight: 700; padding: 10px 0;
    border-radius: 10px; font-family: 'Jua', sans-serif;
  }
  .line-row .side-badge.dr { background: var(--blue-light); color: var(--blue); }
  .line-row .side-badge.cr { background: var(--sun-light); color: #B5860C; }
  .line-row select { flex: 1.3; }
  .line-row input { flex: 1; }
  .line-row .rm-btn { flex-shrink: 0; background: var(--sad-light); border: none; color: var(--sad); font-size: 15px; cursor: pointer; padding: 8px 10px; border-radius: 10px; }

  .add-line-btn {
    background: #FFFCF7; border: 1.5px dashed #E9D8C2; border-radius: 12px; color: var(--ink-soft);
    font-size: 12px; padding: 9px; cursor: pointer; width: 100%; margin-top: 2px; font-weight: 700;
  }
  .add-line-btn:hover { border-color: var(--coral); color: var(--coral); }

  .balance-line { display: flex; justify-content: space-between; font-size: 12px; margin-top: 10px; padding: 9px 12px; border-radius: 10px; }
  .balance-line.ok { color: var(--mint); background: var(--mint-light); font-weight: 700; }
  .balance-line.bad { color: var(--sad); background: var(--sad-light); font-weight: 700; }

  .status-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; }
  .spinner { width: 13px; height: 13px; border: 2.5px solid var(--coral-light); border-top-color: var(--coral); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-line.error { color: var(--sad); }

  .result-card { display: none; }
  .verdict-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .verdict-row .stamp-icon { width: 52px; height: 52px; flex-shrink: 0; }
  .verdict-badge { font-family: 'Jua', sans-serif; font-size: 17px; }
  .verdict-badge.정답 { color: var(--mint); }
  .verdict-badge.부분정답 { color: #B5860C; }
  .verdict-badge.오답 { color: var(--sad); }
  .score-line { font-size: 12.5px; color: var(--ink-soft); }
  .score-line b { color: var(--ink); font-size: 16px; }
  .result-block { background: #FFFCF7; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px; margin-bottom: 10px; font-size: 13px; line-height: 1.6; white-space: pre-line; }
  .result-block .label { font-size: 11px; font-weight: 700; color: var(--coral); margin-bottom: 5px; letter-spacing: .02em; }
  .retry-btn {
    width: 100%; margin-top: 4px; background: #FFFCF7; color: var(--coral); border: 1.5px solid var(--coral-2);
    padding: 12px; border-radius: 14px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .retry-btn:hover { background: var(--coral-light); }

  .hint-btn {
    display: block; width: 100%; text-align: center; background: none; border: none;
    color: var(--blue); font-size: 12px; font-weight: 700; padding: 9px 0 2px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .hint-btn:hover { color: #3E6FE0; }
  .hint-btn:disabled { color: var(--ink-soft); cursor: not-allowed; text-decoration: none; }
  .hint-box {
    display: none; background: var(--blue-light); border: 1.5px solid #C8D7FF; border-radius: 14px;
    padding: 13px; margin-top: 4px; margin-bottom: 10px; font-size: 12.5px; line-height: 1.6; white-space: pre-line;
  }
  .hint-box .label { font-size: 11px; font-weight: 700; color: var(--blue); margin-bottom: 5px; }
  .hint-used-note { font-size: 11px; color: var(--blue); margin-top: -4px; margin-bottom: 10px; font-weight: 700; }

  .extract-status { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-soft); margin-top: 9px; }
  .extract-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); flex-shrink: 0; }
  .extract-status.loading .dot { background: var(--sun); animation: pulse 1s ease-in-out infinite; }
  .extract-status.error .dot { background: var(--sad); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .ref-amount { display: none; background: var(--mint-light); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: var(--mint); font-weight: 700; margin-top: 8px; }

  .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px; font-size: 12.5px; border-bottom: 1px dashed var(--line); }
  .history-item:last-child { border-bottom: none; }
  .history-item .tag { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .history-item .tag.정답 { background: var(--mint-light); color: var(--mint); }
  .history-item .tag.부분정답 { background: var(--sun-light); color: #B5860C; }
  .history-item .tag.오답 { background: var(--sad-light); color: var(--sad); }
  .history-empty { color: var(--ink-soft); font-size: 12.5px; text-align: center; padding: 14px 0; }

  canvas { display: none; }
</style>
</head>
<body>

<header>
  <div class="blob"></div>
  <div class="blob2"></div>
  <div class="header-row">
    <svg class="mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse cx="50" cy="90" rx="26" ry="5" fill="rgba(0,0,0,0.08)"/>
      <circle cx="50" cy="52" r="38" fill="#FFF9EF"/>
      <circle cx="50" cy="52" r="38" fill="none" stroke="#FFE0CE" stroke-width="3"/>
      <path d="M28 30 Q50 8 72 30" fill="none" stroke="#3A2E22" stroke-width="4" stroke-linecap="round"/>
      <circle cx="34" cy="53" r="5" fill="#3A2E22"/>
      <circle cx="66" cy="53" r="5" fill="#3A2E22"/>
      <circle cx="35.5" cy="51.5" r="1.6" fill="#fff"/>
      <circle cx="67.5" cy="51.5" r="1.6" fill="#fff"/>
      <ellipse cx="26" cy="63" rx="6" ry="4" fill="#FF9C7F" opacity="0.7"/>
      <ellipse cx="74" cy="63" rx="6" ry="4" fill="#FF9C7F" opacity="0.7"/>
      <path d="M42 66 Q50 74 58 66" fill="none" stroke="#3A2E22" stroke-width="3.5" stroke-linecap="round"/>
      <g transform="translate(63,68) rotate(18)">
        <circle cx="0" cy="0" r="9" fill="none" stroke="#5C8DFF" stroke-width="3.5"/>
        <line x1="6.5" y1="6.5" x2="14" y2="14" stroke="#5C8DFF" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </svg>
    <div class="header-text">
      <div class="eyebrow">JOURNAL ENTRY PRACTICE</div>
      <h1 class="display">영수증 분개 연습</h1>
      <p>내가 받은 진짜 영수증으로 분개 연습! 제출하면 AI 선생님이 채점해줘요.</p>
    </div>
  </div>
</header>

<main>

  <div class="card">
    <h2><span class="num">1</span>내 정보</h2>
    <div class="field-row">
      <div class="field">
        <label>학번</label>
        <input type="text" id="studentId" placeholder="예: 10203" inputmode="numeric" />
      </div>
      <div class="field">
        <label>이름</label>
        <input type="text" id="studentName" placeholder="예: 홍길동" />
      </div>
    </div>
  </div>

  <div class="card" id="uploadCard">
    <h2><span class="num">2</span>내 영수증 업로드</h2>
    <div class="drop" id="dropZone">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="20" width="48" height="34" rx="8" fill="#FFE4D6"/>
        <circle cx="32" cy="37" r="11" fill="#FFFCF7" stroke="#FF7A59" stroke-width="3"/>
        <circle cx="32" cy="37" r="5" fill="#FF9C7F"/>
        <rect x="24" y="14" width="16" height="8" rx="3" fill="#FF7A59"/>
        <circle cx="47" cy="27" r="2.4" fill="#FF7A59"/>
      </svg>
      <div class="main-txt">내가 받은 영수증 사진을 올려주세요</div>
      <div class="sub-txt">정면에서 프레임 꽉 차게 찍으면 더 잘 읽혀요</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" />
    <div class="receipt-preview" id="receiptPreview" style="display:none;">
      <img id="previewImg" alt="내 영수증" />
      <div><button class="change-btn" id="changeBtn">다른 사진으로 바꾸기</button></div>
      <div class="extract-status" id="extractStatus" style="display:none;"><span class="dot"></span><span id="extractStatusText"></span></div>
      <div class="ref-amount" id="refAmount"></div>
    </div>
  </div>

  <div class="card locked" id="entryCard">
    <h2><span class="num">3</span>내가 직접 분개 작성하기</h2>
    <div class="field-row">
      <div class="field">
        <label>거래일자</label>
        <input type="date" id="dateInput" />
      </div>
      <div class="field">
        <label>가맹점명 (메모)</label>
        <input type="text" id="vendorInput" placeholder="예: OO카페" />
      </div>
    </div>
    <div class="hint">영수증을 보고 어떤 거래인지 파악한 뒤, 차변/대변 계정과목과 금액을 직접 채워보세요.</div>

    <div class="lines-wrap" id="linesWrap"></div>
    <div class="field-row" style="gap:7px;">
      <button type="button" class="add-line-btn" id="addDrBtn" style="flex:1;">+ 차변 줄 추가</button>
      <button type="button" class="add-line-btn" id="addCrBtn" style="flex:1;">+ 대변 줄 추가</button>
    </div>

    <div class="balance-line" id="balanceLine"></div>

    <div class="hint-box" id="hintBox">
      <div class="label">💡 힌트</div>
      <div id="hintText"></div>
    </div>
    <div class="hint-used-note" id="hintUsedNote" style="display:none;">✓ 힌트를 확인했어요. 제출하면 선생님도 힌트 사용 여부를 볼 수 있어요.</div>

    <button class="primary" id="submitBtn" disabled>제출하고 채점받기</button>
    <button type="button" class="hint-btn" id="hintBtn" disabled>답을 못 찾겠어요 · 힌트 보기</button>
    <div class="status-line" id="statusLine" style="display:none;"></div>
  </div>

  <div class="card result-card" id="resultCard">
    <h2><span class="num">✓</span>채점 결과</h2>
    <div class="verdict-row" id="verdictRow"></div>
    <div class="score-line">점수: <b id="scoreVal">-</b> / 100</div>
    <div class="result-block" style="margin-top:12px;">
      <div class="label">AI 선생님 피드백</div>
      <div id="feedbackText"></div>
    </div>
    <div class="result-block">
      <div class="label">모범 분개</div>
      <div id="correctAnswerText"></div>
    </div>
    <button class="retry-btn" id="retryBtn">다른 영수증으로 다시 연습하기</button>
  </div>

  <div class="card">
    <h2><span class="num">·</span>내 연습 기록 (이 기기에 저장됨)</h2>
    <div id="historyList"></div>
    <div class="history-empty" id="historyEmpty">아직 연습 기록이 없어요.</div>
  </div>

</main>

<canvas id="workCanvas"></canvas>

<script>
  // ==== 배포 시 아래 URL을 apps-script/Code.gs 배포 후 받은 웹앱 URL로 바꿔주세요 ====
  // 설정 방법: apps-script/README.md 참고
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyLWpS6TKW6R1cgdA7kEidFYpxyhHMeRK8F1qWeyNZi0B9exblJjLIVE0qDHe_eBwWF/exec';

  const DR_ACCOUNTS = ['소모품비','도서인쇄비','여비교통비','회의비','접대비','복리후생비','통신비','수도광열비','차량유지비','교육훈련비','광고선전비','사무용품비','식대','기타잡비'];
  const CR_ACCOUNTS = ['현금','보통예금','미지급금','미지급비용'];

  const STAMP_ICONS = {
    '정답': `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <circle cx="30" cy="30" r="27" fill="#DDF4EA"/>
      <path d="M18 31 L26 39 L42 21" fill="none" stroke="#35B58C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,
    '부분정답': `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <circle cx="30" cy="30" r="27" fill="#FFF2D2"/>
      <path d="M30 14 L35 25 L47 26.5 L38.5 34.5 L41 46 L30 40 L19 46 L21.5 34.5 L13 26.5 L25 25 Z" fill="#FFC94A"/>
    </svg>`,
    '오답': `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <circle cx="30" cy="30" r="27" fill="#FFE7E7"/>
      <circle cx="22" cy="27" r="3" fill="#FF6B6B"/>
      <circle cx="38" cy="27" r="3" fill="#FF6B6B"/>
      <path d="M20 40 Q30 33 40 40" fill="none" stroke="#FF6B6B" stroke-width="3.5" stroke-linecap="round"/>
    </svg>`
  };

  const studentIdInput = document.getElementById('studentId');
  const studentNameInput = document.getElementById('studentName');
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const receiptPreview = document.getElementById('receiptPreview');
  const previewImg = document.getElementById('previewImg');
  const extractStatus = document.getElementById('extractStatus');
  const extractStatusText = document.getElementById('extractStatusText');
  const refAmount = document.getElementById('refAmount');
  const changeBtn = document.getElementById('changeBtn');
  const entryCard = document.getElementById('entryCard');
  const dateInput = document.getElementById('dateInput');
  const vendorInput = document.getElementById('vendorInput');
  const linesWrap = document.getElementById('linesWrap');
  const addDrBtn = document.getElementById('addDrBtn');
  const addCrBtn = document.getElementById('addCrBtn');
  const balanceLine = document.getElementById('balanceLine');
  const submitBtn = document.getElementById('submitBtn');
  const hintBtn = document.getElementById('hintBtn');
  const hintBox = document.getElementById('hintBox');
  const hintText = document.getElementById('hintText');
  const hintUsedNote = document.getElementById('hintUsedNote');
  const statusLine = document.getElementById('statusLine');
  const resultCard = document.getElementById('resultCard');
  const verdictRow = document.getElementById('verdictRow');
  const scoreVal = document.getElementById('scoreVal');
  const feedbackText = document.getElementById('feedbackText');
  const correctAnswerText = document.getElementById('correctAnswerText');
  const retryBtn = document.getElementById('retryBtn');
  const historyList = document.getElementById('historyList');
  const historyEmpty = document.getElementById('historyEmpty');
  const workCanvas = document.getElementById('workCanvas');

  let processed = null;
  let lineSeq = 0;
  let lines = []; // {id, side:'dr'|'cr', account, amount}
  let hintUsed = false;

  // 학번/이름은 이 기기에 기억
  studentIdInput.value = localStorage.getItem('je_studentId') || '';
  studentNameInput.value = localStorage.getItem('je_studentName') || '';
  studentIdInput.addEventListener('input', () => localStorage.setItem('je_studentId', studentIdInput.value));
  studentNameInput.addEventListener('input', () => localStorage.setItem('je_studentName', studentNameInput.value));

  dateInput.valueAsDate = new Date();

  dropZone.addEventListener('click', () => fileInput.click());
  changeBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      processed = await preprocessImage(file);
    } catch (err) {
      console.error(err);
      processed = await rawFallback(file);
    }
    previewImg.src = 'data:' + processed.mediaType + ';base64,' + processed.base64;
    receiptPreview.style.display = 'block';
    dropZone.style.display = 'none';
    entryCard.classList.remove('locked');
    if (lines.length === 0) { addLine('dr'); addLine('cr'); }
    hintBtn.disabled = false;
    updateSubmitState();
    runExtract();
  });

  // 가맹점명/거래일자/금액만 자동으로 읽어옴 (계정과목 판단은 학생이 직접)
  async function runExtract() {
    extractStatus.style.display = 'flex';
    extractStatus.className = 'extract-status loading';
    extractStatusText.textContent = '가맹점명·날짜·금액을 읽는 중…';
    refAmount.style.display = 'none';

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'extract',
          imageBase64: processed.base64,
          imageMediaType: processed.mediaType
        })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '인식 오류');

      const r = data.result;
      if (r.vendor) vendorInput.value = r.vendor;
      if (r.date) dateInput.value = r.date;
      if (r.amount) {
        refAmount.style.display = 'block';
        refAmount.textContent = '📖 인식된 결제금액: ' + formatNumber(r.amount) + '원 (참고용 — 차변/대변 합계를 이 금액에 맞춰보세요)';
      }
      updateSubmitState();

      extractStatus.className = 'extract-status';
      extractStatusText.textContent = r.unclear_fields && r.unclear_fields.length
        ? '자동으로 읽었어요. 확인이 필요해요: ' + r.unclear_fields.join(', ')
        : '가맹점명·날짜·금액을 자동으로 읽었어요. 틀렸으면 직접 고쳐도 돼요.';
    } catch (err) {
      console.error(err);
      extractStatus.className = 'extract-status error';
      extractStatusText.textContent = '자동 인식에 실패했어요. 가맹점명·날짜는 직접 입력해주세요.';
    }
  }

  async function preprocessImage(file) {
    let bitmap;
    try { bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { bitmap = await createImageBitmap(file); }
    const maxDim = 1600;
    const longest = Math.max(bitmap.width, bitmap.height);
    const scale = Math.min(1, maxDim / longest);
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    workCanvas.width = w; workCanvas.height = h;
    const ctx = workCanvas.getContext('2d');
    ctx.filter = 'contrast(1.14) brightness(1.04)';
    ctx.drawImage(bitmap, 0, 0, w, h);
    const dataUrl = workCanvas.toDataURL('image/jpeg', 0.88);
    return { base64: dataUrl.split(',')[1], mediaType: 'image/jpeg', width: w, height: h };
  }
  async function rawFallback(file) {
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file);
    });
    return { base64: dataUrl.split(',')[1], mediaType: file.type || 'image/jpeg', width: 0, height: 0 };
  }

  function formatNumber(n) { if (n === null || n === undefined || isNaN(n)) return ''; return Number(n).toLocaleString('ko-KR'); }
  function digitsOnly(v) { return (v || '').toString().replace(/[^0-9]/g, ''); }

  function addLine(side) {
    const id = ++lineSeq;
    lines.push({ id, side, account: '', amount: null });
    renderLines();
  }

  function renderLines() {
    linesWrap.innerHTML = '';
    lines.forEach(line => {
      const row = document.createElement('div');
      row.className = 'line-row';
      const accounts = line.side === 'dr' ? DR_ACCOUNTS : CR_ACCOUNTS;
      row.innerHTML = `
        <div class="side-badge ${line.side}">${line.side === 'dr' ? '차변' : '대변'}</div>
        <select data-id="${line.id}" data-role="account">
          <option value="">계정과목 선택</option>
          ${accounts.map(a => `<option value="${a}" ${line.account===a?'selected':''}>${a}</option>`).join('')}
        </select>
        <input type="text" inputmode="numeric" placeholder="금액" data-id="${line.id}" data-role="amount" value="${line.amount ? formatNumber(line.amount) : ''}">
        <button type="button" class="rm-btn" data-id="${line.id}">×</button>
      `;
      linesWrap.appendChild(row);
    });
  }

  linesWrap.addEventListener('change', (ev) => {
    const id = parseInt(ev.target.dataset.id, 10);
    const line = lines.find(l => l.id === id);
    if (!line) return;
    if (ev.target.dataset.role === 'account') line.account = ev.target.value;
    updateBalance(); updateSubmitState();
  });
  linesWrap.addEventListener('input', (ev) => {
    if (ev.target.dataset.role !== 'amount') return;
    const id = parseInt(ev.target.dataset.id, 10);
    const line = lines.find(l => l.id === id);
    const d = digitsOnly(ev.target.value);
    ev.target.value = d ? formatNumber(d) : '';
    line.amount = d ? parseInt(d, 10) : null;
    updateBalance(); updateSubmitState();
  });
  linesWrap.addEventListener('click', (ev) => {
    if (!ev.target.classList.contains('rm-btn')) return;
    const id = parseInt(ev.target.dataset.id, 10);
    lines = lines.filter(l => l.id !== id);
    renderLines(); updateBalance(); updateSubmitState();
  });

  addDrBtn.addEventListener('click', () => addLine('dr'));
  addCrBtn.addEventListener('click', () => addLine('cr'));

  function updateBalance() {
    const drTotal = lines.filter(l => l.side === 'dr').reduce((s, l) => s + (l.amount || 0), 0);
    const crTotal = lines.filter(l => l.side === 'cr').reduce((s, l) => s + (l.amount || 0), 0);
    if (drTotal === 0 && crTotal === 0) { balanceLine.textContent = ''; balanceLine.className = 'balance-line'; return; }
    if (drTotal === crTotal) {
      balanceLine.className = 'balance-line ok';
      balanceLine.textContent = `✓ 차변 ${formatNumber(drTotal)}원 = 대변 ${formatNumber(crTotal)}원 (대차 일치!)`;
    } else {
      balanceLine.className = 'balance-line bad';
      balanceLine.textContent = `앗! 차변 ${formatNumber(drTotal)}원 ≠ 대변 ${formatNumber(crTotal)}원 — 금액을 다시 확인해보세요`;
    }
  }

  function updateSubmitState() {
    const drTotal = lines.filter(l => l.side === 'dr').reduce((s, l) => s + (l.amount || 0), 0);
    const crTotal = lines.filter(l => l.side === 'cr').reduce((s, l) => s + (l.amount || 0), 0);
    const allAccountsFilled = lines.length >= 2 && lines.every(l => l.account && l.amount);
    const balanced = drTotal > 0 && drTotal === crTotal;
    const idOk = studentIdInput.value.trim() && studentNameInput.value.trim();
    submitBtn.disabled = !(processed && dateInput.value && allAccountsFilled && balanced && idOk);
  }
  studentIdInput.addEventListener('input', updateSubmitState);
  studentNameInput.addEventListener('input', updateSubmitState);
  dateInput.addEventListener('input', updateSubmitState);

  function setStatus(msg, type) {
    statusLine.style.display = 'flex';
    statusLine.className = 'status-line' + (type ? ' ' + type : '');
    if (type === 'loading') statusLine.innerHTML = '<span class="spinner"></span><span>' + msg + '</span>';
    else statusLine.textContent = msg;
  }

  hintBtn.addEventListener('click', async () => {
    if (!processed) return;
    hintBtn.disabled = true;
    hintBtn.textContent = '힌트를 불러오는 중…';

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'hint',
          studentId: studentIdInput.value.trim(),
          studentName: studentNameInput.value.trim(),
          imageBase64: processed.base64,
          imageMediaType: processed.mediaType
        })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '힌트 요청 오류');

      hintText.textContent = data.result.explanation + '\n\n정답 분개: ' + data.result.correct_answer;
      hintBox.style.display = 'block';
      hintUsedNote.style.display = 'block';
      hintUsed = true;
      hintBtn.textContent = '힌트 다시 보기';
      hintBtn.disabled = false;
    } catch (err) {
      console.error(err);
      hintText.textContent = '힌트를 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
      hintBox.style.display = 'block';
      hintBtn.textContent = '답을 못 찾겠어요 · 힌트 보기';
      hintBtn.disabled = false;
    }
  });

  submitBtn.addEventListener('click', async () => {
    submitBtn.disabled = true;
    setStatus('AI 선생님이 영수증을 확인하고 채점하는 중입니다…', 'loading');

    const payload = {
      studentId: studentIdInput.value.trim(),
      studentName: studentNameInput.value.trim(),
      imageBase64: processed.base64,
      imageMediaType: processed.mediaType,
      date: dateInput.value,
      vendor: vendorInput.value.trim(),
      lines: lines.map(l => ({ side: l.side, account: l.account, amount: l.amount })),
      hintUsed: hintUsed
    };

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '채점 서버 오류');

      showResult(data.result);
      saveHistory(data.result);
      statusLine.style.display = 'none';
    } catch (err) {
      console.error(err);
      setStatus('채점 요청에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.', 'error');
      submitBtn.disabled = false;
    }
  });

  function showResult(result) {
    resultCard.style.display = 'block';
    const icon = STAMP_ICONS[result.verdict] || STAMP_ICONS['오답'];
    verdictRow.innerHTML = `<span class="stamp-icon">${icon}</span><span class="verdict-badge display ${result.verdict}">${result.verdict}</span>`;
    scoreVal.textContent = result.score;
    feedbackText.textContent = result.feedback;
    correctAnswerText.textContent = result.correct_answer;
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  retryBtn.addEventListener('click', () => {
    resultCard.style.display = 'none';
    fileInput.value = '';
    processed = null;
    receiptPreview.style.display = 'none';
    dropZone.style.display = 'block';
    entryCard.classList.add('locked');
    lines = [];
    renderLines();
    vendorInput.value = '';
    dateInput.valueAsDate = new Date();
    balanceLine.textContent = ''; balanceLine.className = 'balance-line';
    hintUsed = false;
    hintBox.style.display = 'none';
    hintUsedNote.style.display = 'none';
    hintBtn.textContent = '답을 못 찾겠어요 · 힌트 보기';
    hintBtn.disabled = true;
    extractStatus.style.display = 'none';
    refAmount.style.display = 'none';
    updateSubmitState();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  function saveHistory(result) {
    const hist = JSON.parse(localStorage.getItem('je_history') || '[]');
    hist.unshift({ date: dateInput.value, vendor: vendorInput.value.trim(), verdict: result.verdict, score: result.score, ts: Date.now() });
    localStorage.setItem('je_history', JSON.stringify(hist.slice(0, 30)));
    renderHistory();
  }

  function renderHistory() {
    const hist = JSON.parse(localStorage.getItem('je_history') || '[]');
    if (hist.length === 0) { historyEmpty.style.display = 'block'; historyList.innerHTML = ''; return; }
    historyEmpty.style.display = 'none';
    historyList.innerHTML = hist.map(h => `
      <div class="history-item">
        <span>${h.date}${h.vendor ? ' · ' + h.vendor : ''}</span>
        <span><span class="tag ${h.verdict}">${h.verdict}</span> ${h.score}점</span>
      </div>
    `).join('');
  }

  renderLines();
  renderHistory();
</script>

</body>
</html>
