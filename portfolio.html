<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 활동 포트폴리오 - MOMENT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fffaf8;--rose:#b5545a;--rose-soft:#e8a4a4;--rose-light:#f7e6e6;--gold:#c9a96e;--sage:#8ca77f;--ink:#2c1f1f;--muted:#7d716d;--fn-en:'Playfair Display',serif;--fn-kr:'Noto Serif KR',serif;--fn-sans:'Noto Sans KR',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--fn-sans);background:var(--cream);color:var(--ink);overflow-x:hidden}a{text-decoration:none;color:inherit}
.site-header{position:fixed;top:0;left:0;right:0;z-index:200;height:72px;padding:0 3.1%;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(44,31,31,.08);box-shadow:0 10px 28px rgba(44,31,31,.04);backdrop-filter:blur(8px);font-family:Arial,"Noto Sans KR",sans-serif}
.brand{display:flex;flex-direction:column;align-items:flex-start;line-height:1;color:var(--ink)}.brand-main{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,2.35vw,34px);font-weight:600;letter-spacing:.08em}.brand-sub{margin-top:7px;padding-left:.45em;font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.36em;text-transform:uppercase}
nav{display:flex;align-items:center;gap:clamp(28px,3.3vw,48px)}nav a{font-family:Arial,"Noto Sans KR",sans-serif;font-size:14px;color:var(--ink);white-space:nowrap;font-weight:700;transition:color .2s ease}nav a:hover{color:var(--rose)}.nav-cta{padding:10px 22px;color:#fff!important;background:#bf4f5e;border-radius:999px;box-shadow:0 8px 18px rgba(181,84,90,.18);font-size:14px;font-weight:600}.nav-cta:hover{background:#9f3f4d;color:#fff!important}
.menu-toggle{display:none;width:42px;height:42px;border:0;background:transparent}.menu-toggle span{display:block;width:24px;height:2px;margin:6px auto;background:var(--ink)}.mobile-nav{display:none;position:fixed;top:72px;left:0;right:0;z-index:199;padding:20px 6% 26px;background:rgba(255,255,255,.98);border-bottom:1px solid rgba(181,84,90,.14)}.mobile-nav.open{display:grid;gap:16px}
.section{padding:82px 5%}.section-head{display:flex;align-items:end;justify-content:space-between;gap:28px;margin:0 auto 34px;max-width:1180px}.section-head h2{font-family:var(--fn-kr);font-size:30px;font-weight:600}.section-head p{max-width:460px;color:var(--muted);line-height:1.8;font-size:14px}
.gallery{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:white;border:1px solid var(--rose-light);border-radius:8px;overflow:hidden;box-shadow:0 14px 34px rgba(181,84,90,.08)}.photo{position:relative;min-height:260px;padding:24px;display:flex;align-items:end;overflow:hidden;background-size:cover;background-repeat:no-repeat;background-position:center}.photo::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(44,31,31,0) 35%,rgba(44,31,31,.58) 100%)}.photo::after{content:'';position:absolute;inset:0;border:1px solid rgba(255,255,255,.35);pointer-events:none}
.p1,.p2,.p3,.p4,.p5,.p6{background-image:url('assets/portfolio-student-activities.jpg');background-size:300% 200%}
.p1{background-position:0 0}.p2{background-position:50% 0}.p3{background-position:100% 0}.p4{background-position:0 100%}.p5{background-position:50% 100%}.p6{background-position:100% 100%}
.photo-title{position:relative;z-index:1;color:white;text-shadow:0 2px 8px rgba(44,31,31,.28)}.photo-title span{display:block;font-family:var(--fn-sans);font-size:12px;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.88);opacity:1;margin-bottom:7px}.photo-title strong{font-family:var(--fn-kr);font-size:22px;font-weight:600}.body{padding:22px}.body p{color:var(--muted);font-size:14px;line-height:1.8}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.tags span{font-size:12px;color:var(--rose);background:var(--cream);border:1px solid var(--rose-light);border-radius:999px;padding:5px 10px}
.process{background:white;border-top:1px solid var(--rose-light);border-bottom:1px solid var(--rose-light)}.steps{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rose-light);border:1px solid var(--rose-light)}.step{background:#fff;padding:30px}.step b{font-family:var(--fn-en);font-size:13px;color:var(--rose);letter-spacing:.16em}.step h3{font-family:var(--fn-kr);font-size:18px;font-weight:600;margin:12px 0 10px}.step p{font-size:13px;line-height:1.8;color:var(--muted)}
footer{background:var(--rose);color:white;padding:52px 5% 32px}.ft{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:28px;padding-bottom:32px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:24px}.ft-logo{font-family:var(--fn-en);font-size:18px;font-weight:700;letter-spacing:.12em;margin-bottom:9px}.ft-desc{font-size:13px;opacity:.65;line-height:1.8;max-width:280px}.ft-links{display:flex;gap:22px;flex-wrap:wrap}.ft-links a{font-size:13px;opacity:.75}.ft-btm{font-size:12px;opacity:.4}
@media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.section-head{display:block}.section-head p{margin-top:12px}.site-header nav{display:none}.menu-toggle{display:block}}
@media(max-width:560px){.site-header{height:72px}.brand-main{font-size:27px}.brand-sub{font-size:9px}.mobile-nav{top:72px}.hero{padding-top:124px}.gallery,.steps{grid-template-columns:1fr}.photo{min-height:220px}}
/* Header locked to index.html */
.site-header{left:0!important;right:auto!important;width:100vw!important;box-sizing:border-box!important;height:72px!important;padding:0 3.1vw!important;display:flex!important;align-items:center!important;justify-content:space-between!important;background:rgba(255,255,255,.96)!important;border-bottom:1px solid rgba(44,31,31,.08)!important;box-shadow:0 10px 28px rgba(44,31,31,.04)!important;font-family:Arial,"Noto Sans KR",sans-serif!important;transition:none!important}

.site-header .brand-sub{margin-top:7px!important;padding-left:.45em!important;font-family:Georgia,"Times New Roman",serif!important;font-size:10px!important;letter-spacing:.36em!important;text-transform:uppercase!important;color:#2c1f1f!important}
.site-header nav{display:flex!important;align-items:center!important;gap:clamp(28px,3.3vw,48px)!important;font-family:Arial,"Noto Sans KR",sans-serif!important}
.site-header nav a{font-family:Arial,"Noto Sans KR",sans-serif!important;font-size:14px!important;font-weight:700!important;color:#2c1f1f!important;white-space:nowrap!important;position:static!important;line-height:1!important;transition:none!important}
.site-header nav a::after{display:none!important}
.site-header nav .nav-cta,.site-header .nav .contact{display:inline-flex!important;align-items:center!important;justify-content:center!important;width:92px!important;height:40px!important;padding:0 22px!important;box-sizing:border-box!important;color:#fff!important;background:#bf4f5e!important;border-radius:999px!important;box-shadow:0 8px 18px rgba(181,84,90,.18)!important;font-size:14px!important;font-weight:600!important;line-height:1!important}
.mobile-nav{top:72px!important}
@media(max-width:980px){.site-header{height:64px!important}.site-header nav{display:none!important}.mobile-nav{top:64px!important}}
/* Unified fixed header banner */
.page-banner{display:block!important;margin:72px 0 0!important;width:100%!important;max-width:none!important;height:auto!important;min-height:0!important;padding:0!important;overflow:hidden!important;background:#fffaf8!important;border:0!important;border-bottom:1px solid rgba(181,84,90,.10)!important;line-height:0!important}
.page-banner picture,.page-banner img{display:block!important;width:100%!important;height:auto!important;margin:0!important;padding:0!important}
.page-banner img{object-fit:contain!important;object-position:center center!important}
@media(max-width:980px){.page-banner{margin-top:64px!important}.page-banner img{object-fit:contain!important}}
/* Common subpage footer */
.common-footer{background:#b5545a!important;color:#fff!important;margin:0!important;padding:58px 4.4% 38px!important;font-family:Arial,"Noto Sans KR",sans-serif!important}
.common-footer .footer-inner{max-width:1720px;margin:0 auto!important}
.common-footer .footer-top{display:flex!important;justify-content:space-between!important;align-items:flex-start!important;gap:32px!important;padding-bottom:34px!important;border-bottom:1px solid rgba(255,255,255,.22)!important}
.common-footer .footer-brand{max-width:520px!important}
.common-footer .footer-logo{display:flex!important;align-items:center!important;gap:10px!important;margin-bottom:16px!important;font-family:Georgia,"Times New Roman",serif!important;font-size:18px!important;font-weight:700!important;color:#fff!important}
.common-footer .footer-logo .heart{font-family:Arial,"Noto Sans KR",sans-serif!important;font-size:19px!important;font-weight:400!important;line-height:1!important}
.common-footer .footer-desc{margin:0!important;font-size:14px!important;line-height:1.95!important;color:rgba(255,255,255,.78)!important;white-space:nowrap!important}
.common-footer .footer-links{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:26px!important;flex-wrap:wrap!important;padding-top:7px!important}
.common-footer .footer-links a{font-size:14px!important;font-weight:600!important;color:rgba(255,255,255,.86)!important;text-decoration:none!important;white-space:nowrap!important}
.common-footer .footer-links a:hover{color:#fff!important}
.common-footer .footer-bottom{margin:30px 0 0!important;font-size:13px!important;color:rgba(255,255,255,.46)!important}
@media(max-width:760px){.common-footer{padding:42px 6% 30px!important}.common-footer .footer-desc{white-space:normal!important}.common-footer .footer-top{display:block!important}.common-footer .footer-links{justify-content:flex-start!important;margin-top:28px!important;gap:14px 20px!important}.common-footer .footer-bottom{margin-top:24px!important}}

/* Portfolio activity image page */
.portfolio-activity-page{background:#fffaf8;padding:clamp(28px,3.4vw,64px) clamp(18px,3.2vw,64px) clamp(34px,4vw,72px);overflow:visible}
.portfolio-activity-wrap{width:100%;max-width:1983px;margin:0 auto;line-height:0;background:#fffaf8}
.portfolio-activity-img{display:block;width:100%;max-width:100%;height:auto;margin:0 auto;object-fit:contain;object-position:center top}
@media(max-width:760px){.portfolio-activity-page{padding:24px 14px 34px}.portfolio-activity-wrap{max-width:100%}}
</style>
