<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMENT - Party Recipe</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #fffaf8; }
  body { font-family: Arial, "Noto Sans KR", sans-serif; color: #2c1f1f; overflow-x: hidden; overflow-y: auto; }
  a { color: inherit; text-decoration: none; }
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: auto;
    z-index: 20;
    width: 100vw;
    height: 72px;
    padding: 0 3.1vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, .96);
    border-bottom: 1px solid rgba(44, 31, 31, .08);
    box-shadow: 0 10px 28px rgba(44, 31, 31, .04);
    backdrop-filter: blur(8px);
    font-family: Arial, "Noto Sans KR", sans-serif;
    transition: none;
  }
  .brand { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
  .brand-main {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, 2.35vw, 34px);
    font-weight: 600;
    letter-spacing: .08em;
  }
  .brand-sub {
    margin-top: 7px;
    padding-left: .45em;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10px;
    letter-spacing: .36em;
    text-transform: uppercase;
  }
  .nav { display: flex; align-items: center; gap: clamp(28px, 3.3vw, 48px); font-size: 14px; }
  .nav a {
    font-family: Arial, "Noto Sans KR", sans-serif;
    font-size: 14px;
    font-weight: 400;
    line-height: 1;
    position: static;
    white-space: nowrap;
    transition: none;
  }
  .nav a:hover { color: #b5545a; }
  .nav .contact {
    width: 92px;
    height: 40px;
    padding: 0 22px;
    color: #fff;
    background: #bf4f5e;
    border-radius: 999px;
    box-shadow: 0 8px 18px rgba(181, 84, 90, .18);
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .nav .contact:hover { color: #fff; background: #9f3f4d; }
  .menu-toggle { display: none; width: 42px; height: 42px; border: 0; background: transparent; }
  .menu-toggle span { display: block; width: 24px; height: 2px; margin: 6px auto; background: #2c1f1f; }
  .mobile-nav {
    display: none;
    position: fixed;
    top: 72px;
    left: 0;
    right: 0;
    z-index: 19;
    padding: 20px 6% 26px;
    background: rgba(255, 255, 255, .98);
    border-bottom: 1px solid rgba(181, 84, 90, .14);
  }
  .mobile-nav.open { display: grid; gap: 16px; }
  .screen {
    margin-top: 72px;
    height: calc(100vh - 72px);
    display: grid;
    grid-template-rows: 48.5% 31.5% 20%;
    background: #fff;
  }
  .hero {
    position: relative;
    min-height: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #fffaf8;
  }
  .hero-image {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .categories {
    min-height: 0;
    padding: clamp(14px, 2vh, 22px) 5% clamp(10px, 1.6vh, 18px);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .category-grid {
    width: min(1090px, 100%);
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: clamp(10px, 1vw, 16px);
  }
  .category-card {
    min-height: clamp(82px, 12.3vh, 128px);
    padding: clamp(10px, 1.5vh, 18px) 8px;
    display: grid;
    place-items: center;
    text-align: center;
    border: 1px solid rgba(181, 84, 90, .12);
    border-radius: 8px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 8px 26px rgba(44,31,31,.055);
    transition: transform .2s ease, border-color .2s ease;
  }
  .category-card:hover { transform: translateY(-2px); border-color: rgba(181,84,90,.34); }
  .cat-icon {
    width: clamp(30px, 4vh, 48px);
    height: clamp(30px, 4vh, 48px);
    margin-bottom: clamp(6px, 1vh, 10px);
    color: #a77658;
  }
  .cat-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
  .cat-ko { display: block; font-size: clamp(12px, 1.55vh, 16px); font-weight: 500; }
  .cat-en { display: block; margin-top: 5px; font-size: clamp(9px, 1.18vh, 12px); color: #a77658; text-transform: uppercase; }
  .category-card:nth-child(n+7) { transform: none; }`r`n  .category-card:nth-child(n+7):hover { transform: translateY(-2px); }`r`n  @media (min-width: 981px) { .category-card:nth-child(7) { grid-column: 2; } }
  .features {
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: center;
    padding: 0 7.4%;
    background:
      linear-gradient(90deg, rgba(255, 250, 248, .96), rgba(255, 246, 242, .94), rgba(255, 250, 248, .96));
    border-top: 1px solid rgba(181, 84, 90, .08);
    box-shadow: 0 -16px 34px rgba(181, 84, 90, .05);
  }
  .feature-item {
    min-width: 0;
    display: grid;
    grid-template-columns: clamp(38px, 4vw, 54px) 1fr;
    gap: clamp(10px, 1.3vw, 20px);
    align-items: center;
    padding: 0 clamp(14px, 2vw, 30px);
    border-left: 1px solid rgba(181, 84, 90, .22);
  }
  .feature-item:first-child { border-left: 0; }
  .feature-icon {
    width: clamp(34px, 3.6vw, 50px);
    height: clamp(34px, 3.6vw, 50px);
    color: #2c1f1f;
  }
  .feature-icon svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.45;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .feature-title {
    margin: 0 0 7px;
    font-size: clamp(14px, 1.7vh, 18px);
    font-weight: 500;
    color: #2c1f1f;
    letter-spacing: 0;
  }
  .feature-copy {
    margin: 0;
    font-size: clamp(11px, 1.32vh, 14px);
    line-height: 1.65;
    color: #4f4642;
    letter-spacing: 0;
  }
  @media (max-width: 980px) {
    body { overflow: auto; }
    .site-header { height: 64px; }
    .brand-main { font-size: 27px; }
    .brand-sub { font-size: 9px; }
    .nav { display: none; }
    .menu-toggle { display: block; }
    .mobile-nav { top: 64px; }
    .screen {
      margin-top: 64px;
      height: auto;
      min-height: 0;
      display: block;
    }
    .hero { height: 56vw; min-height: 330px; }
    .categories { padding: 24px 5%; }
    .category-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .category-card:nth-child(n+7) { transform: none; }
    .category-card:nth-child(n+7):hover { transform: translateY(-2px); }
    .features { grid-template-columns: 1fr; padding: 18px 5%; gap: 1px; background: #f7e6e6; }
    .feature-item { border-left: 0; background: #fffaf8; padding: 18px; }
  }
  @media (max-height: 760px) and (min-width: 981px) {
    .screen { grid-template-rows: 47% 32% 21%; min-height: calc(100vh - 72px); }
    .category-grid { gap: 10px; }
    .category-card { min-height: 82px; }
  }
/* Unified fixed header banner */
.page-banner{display:block!important;margin:72px 0 0!important;width:100%!important;max-width:none!important;height:auto!important;min-height:0!important;padding:0!important;overflow:hidden!important;background:#fffaf8!important;border:0!important;border-bottom:1px solid rgba(181,84,90,.10)!important;line-height:0!important}
.page-banner picture,.page-banner img{display:block!important;width:100%!important;height:auto!important;margin:0!important;padding:0!important}
.page-banner img{object-fit:contain!important;object-position:center center!important}
@media(max-width:980px){.page-banner{margin-top:64px!important}.page-banner img{object-fit:contain!important}}
/* Home concept layout */
.home-detail{background:#fff!important;margin:0!important;padding:0!important;display:block!important}
.categories{padding:20px 4% 18px!important;background:#fff!important;overflow:hidden!important;display:flex!important;align-items:center!important;justify-content:center!important}
.category-grid{width:min(1128px,100%)!important;display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:14px 16px!important;align-items:start!important;margin:0 auto!important}
.category-card.image-card{min-height:0!important;padding:0!important;border:0!important;border-radius:8px!important;background:transparent!important;box-shadow:none!important;overflow:visible!important;transform:none!important}
.category-card.image-card img{display:block!important;width:100%!important;height:auto!important;border-radius:8px!important;box-shadow:0 8px 22px rgba(44,31,31,.055)!important}
.category-card.image-card:hover{transform:translateY(-2px)!important}
.category-card.image-card:hover img{box-shadow:0 14px 30px rgba(181,84,90,.12)!important}
.home-bottom{display:block!important;width:100%!important;margin:0!important;padding:0!important;background:#fffaf8!important;line-height:0!important;overflow:hidden!important;border-top:1px solid rgba(181,84,90,.06)!important}
.home-bottom img{display:block!important;width:100%!important;height:auto!important;margin:0!important;padding:0!important}
@media (min-width:981px){.category-grid .category-card.image-card:nth-child(7){grid-column:2!important}}
@media (max-width:980px){.categories{padding:18px 5% 16px!important}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;width:min(560px,100%)!important;gap:12px!important}.category-grid .category-card.image-card:nth-child(7){grid-column:auto!important}}
</style>
</head>
